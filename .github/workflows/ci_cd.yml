name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run Pytest Tests
      run: python -m pytest
      env:
        OPENAI_API_KEY: "dummy-key-for-tests"
        DATABASE_URL: "sqlite:///:memory:"
        SHOPIFY_API_SECRET: "dummy-secret"
        SHOPIFY_API_KEY: "dummy-api-key"

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - run: pip install -r requirements.txt

    - name: Apply migrations then check for model drift
      run: |
        alembic upgrade head
        alembic check
      env:
        DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"
