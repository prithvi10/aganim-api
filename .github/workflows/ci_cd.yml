name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run Pytest Tests
      run: python -m pytest
      env:
        OPENAI_API_KEY: "dummy-key-for-tests"
        DATABASE_URL: "sqlite:///:memory:"
        SHOPIFY_API_SECRET: "dummy-secret"
        SHOPIFY_API_KEY: "dummy-api-key"

    - name: Check for pending model changes without a migration
      run: alembic check
      env:
        DATABASE_URL: "sqlite:///:memory:"
