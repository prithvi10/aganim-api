name: CI/CD Pipeline

# 1. TRIGGER: Run on every push to the main branch and on every Pull Request
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------
  # JOB 1: Continuous Integration (CI) - Build and Test
  # ----------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Updated to a newer stable version
        cache: 'pip'

    - name: Install Dependencies
      run: pip install -r requirements.txt
      
    # ⚠️ CRITICAL: Run your Unit Tests
    - name: Run Pytest Tests
      run: python -m pytest
      env:
        # If you have env vars needed for tests (though mocked usually), add them here
        # DATABASE_URL: sqlite:///:memory: # Tests use in-memory explicitly anyway
        pass: true

    # Optional: If you use flake8/Black/Mypy, add linting here
    # - name: Run Linter
    #   run: pip install flake8 && flake8 .
      
  # ----------------------------------------------------
  # JOB 2: Continuous Deployment (CD) - Deploy to Render
  # ----------------------------------------------------
  deploy:
    # 2. DEPENDENCY: Only run if the 'test' job succeeded
    needs: test
    
    # 3. CONDITION: Only deploy when code is pushed to the main branch, not on PRs
    if: github.ref == 'refs/heads/main'
    
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Render Deployment
      run: |
        # Use curl to send an HTTP POST request to the Render Deploy Hook URL
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      env:
        # We need the secret from the GitHub repository settings
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
